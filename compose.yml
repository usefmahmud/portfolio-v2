services:
  portfolio:
    build: .
    container_name: portfolio
    ports:
      - "100.86.40.89:8096:8096"
    environment:
      - PORT=8096
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/"]
      interval: 30s
      timeout: 5s
      retries: 3
