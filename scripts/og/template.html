<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/geist-normal.woff2') format('woff2');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/fonts/geist-mono-normal.woff2') format('woff2');
        font-weight: 400 500;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/fonts/instrument-serif-normal.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/fonts/instrument-serif-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #f1efeb;
        color: #252526;
        font-family: 'Geist', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px;
        box-sizing: border-box;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6b665b;
      }
      h1 {
        font-family: 'Instrument Serif', serif;
        font-weight: 400;
        font-size: 132px;
        line-height: 0.9;
        letter-spacing: -0.03em;
        margin: 0;
      }
      h1 em {
        font-style: italic;
        color: #a63a1e;
      }
      p {
        margin: 18px 0 0;
        font-size: 26px;
        line-height: 1.35;
        max-width: 34ch;
        color: #5a564d;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid #c3bcac;
        padding-top: 18px;
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b665b;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #a63a1e;
        display: inline-block;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span>Portfolio / 2026</span>
      <span>Cairo, Egypt</span>
    </div>
    <div>
      <h1>yousef abdulaziz<br /><em>frontend engineer</em></h1>
      <p>I build interfaces that feel fast, and tooling that gets out of the way.</p>
    </div>
    <div class="bottom">
      <span><span class="dot"></span>Open to work</span>
      <span>usef.mahmoud@outlook.com</span>
    </div>
  </body>
</html>
